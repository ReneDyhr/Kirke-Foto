# Use ingress-provided client IP chain.
RemoteIPHeader X-Forwarded-For

# Trust internal proxy ranges commonly used by Kubernetes clusters/load balancers.
# Tighten these ranges to your exact ingress/LB CIDRs when available.
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16

# Log the rewritten client address (%a) after mod_remoteip processing.
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
