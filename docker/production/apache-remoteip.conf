# Use Cloudflare's client IP header when traffic is proxied via Cloudflare.
RemoteIPHeader CF-Connecting-IP

# Cloudflare edge ranges (IPv4 + IPv6) from Cloudflare's published lists; refreshed at image build.
Include /etc/apache2/conf-available/remoteip-cloudflare.conf

# When the immediate TCP peer is an internal ingress/LB (not Cloudflare), trust these instead.
# Tighten these ranges to your exact ingress/LB CIDRs when available.
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16

# Log the rewritten client address (%a) after mod_remoteip processing.
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
